<!DOCTYPE html>
<html lang="es">
<head>

            <li><a href="#contacto">Contacto</a></li>
        </ul>
    </nav>
</header>
<main>
    <section class="portada contenedor" id="inicio">
        <div>
            <h1>El futuro se construye<span class="azul">conectados.</span></h1>
            <p>Meta crea tecnologias para conectar personas y compartir experiencias.</p>
            <a class="boton" href="#productos">Ver productos</a>
        </div>
    </section>
</main>
</body>
</html>
